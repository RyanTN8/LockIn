<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>LockIn</title>
</head>
<body>
  <header>
    <div class="logo">LockIn</div>
    <div class="tagline">restoring your attention span</div>
  </header>
  <main>
    <div class="row" style="--accent: #ff000018;">
      <div class="platform">
        <span class="dot yt"></span>
        <div>
          <div class="name">YouTube</div>
          <div class="desc">Hide Shorts</div>
        </div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="youtube">
        <span class="slider"></span>
      </label>
    </div>
    <div class="divider"></div>
    <div class="row" style="--accent: #e1306c18;">
      <div class="platform">
        <span class="dot ig"></span>
        <div>
          <div class="name">Instagram</div>
          <div class="desc">Hide Reels</div>
        </div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="instagram">
        <span class="slider"></span>
      </label>
    </div>
  </main>
  <footer>v1.0.0</footer>
  <script src="popup.js"></script>
</body>
</html>
